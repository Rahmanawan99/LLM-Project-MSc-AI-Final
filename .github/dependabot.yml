version: 2
updates:
  # 1. Python Package Updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"          # Check every Monday
      time: "09:00"          # Check at 9:00 AM UTC
    open-pull-requests-limit: 1 # Prevent PR spam (default is 5)
    
    # Automatically add labels and reviewers to Python PRs
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "rahmanawan99"

    # Ignore major versions to prevent breaking changes
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

    # Bundle multiple dependency updates into a single PR
    groups:
      python-dependencies:
        patterns:
          - "*"

  # 2. GitHub Actions Updates (Recommended addition)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
